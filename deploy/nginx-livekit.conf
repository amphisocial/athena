# ============================================================================
# LiveKit signal server — dedicated subdomain: livekit.athenabot.ai
# This is the piece that makes audio actually connect. Without a reachable
# wss:// host here, room.connect() fails with "Failed to fetch".
#
# Prereqs (do these first):
#   1. DNS: an A record  livekit.athenabot.ai -> <this EC2 public IP>
#   2. TLS: certbot --nginx -d livekit.athenabot.ai   (issues the cert this
#      block references below)
#   3. LiveKit server running locally on 7880 (see livekit-setup.md)
#   4. Security group: open UDP 50000-60000 and TCP 7881 to 0.0.0.0/0 so
#      media (WebRTC) can flow. 7880 stays internal (nginx proxies it).
# ============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name livekit.athenabot.ai;

    ssl_certificate     /etc/letsencrypt/live/livekit.athenabot.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/livekit.athenabot.ai/privkey.pem;

    # LiveKit serves both its HTTP API and the WebSocket signal on 7880.
    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;

        # WebSocket upgrade — required for the /rtc signal channel.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Signal connections are long-lived; don't cut them at 60s.
        proxy_read_timeout  86400;
        proxy_send_timeout  86400;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name livekit.athenabot.ai;
    return 301 https://$host$request_uri;
}

