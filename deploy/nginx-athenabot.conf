# /etc/nginx/sites-available/athenabot.ai
# The full product now serves the ROOT domain. Node listens on 127.0.0.1:PORT
# (PORT from .env). The collaborative whiteboard uses WebSockets, so the
# Upgrade/Connection headers below are required.
#
# After enabling:  sudo certbot --nginx -d athenabot.ai -d www.athenabot.ai

server {
    listen 80;
    listen [::]:80;
    server_name athenabot.ai www.athenabot.ai;

    client_max_body_size 25M;   # document uploads for AI generation

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;      # WebSocket (live board)
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }
}

# Retire the old subdomain by 301-ing everything to the root domain, so old
# bookmarks, Google's index, and in-flight sessions land in the right place.
server {
    listen 80;
    listen [::]:80;
    server_name flashcards.athenabot.ai;
    return 301 https://athenabot.ai$request_uri;
}

# Put this in the http{} block (e.g. /etc/nginx/nginx.conf) once, so
# $connection_upgrade is defined for the WebSocket headers above:
#   map $http_upgrade $connection_upgrade { default upgrade; '' close; }
