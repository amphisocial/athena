# /etc/nginx/sites-available/athenabot.ai
# Boardsy now serves the ROOT domain. Node runs on 127.0.0.1:3000 (PORT in .env).
# After enabling:  sudo certbot --nginx -d athenabot.ai -d www.athenabot.ai
server {
    listen 80;
    listen [::]:80;
    server_name athenabot.ai www.athenabot.ai;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
