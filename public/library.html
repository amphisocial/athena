<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/img/boardsy-logo.png?v=boardsy4" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Workbench | Boardsy</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=boardsy4" />
</head>
<body data-page="library">
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Boardsy home">
        <span class="brand-mark">Boardsy</span>
        <span>Board<span class="brand-suffix">sy</span></span>
      </a>
      <nav class="nav-links">
        <a href="/app">Create</a>
        <a href="/notes">Notes</a>
        <a href="/library" class="active">Your Library</a>
        <a href="/board" id="whiteboardNavLink" style="display:none">Whiteboard</a>
        <a href="/team" id="teamNavLink" style="display:none">Team</a>
        <a href="/#pricing">Pricing</a>
      </nav>
      <div class="auth-area" id="authArea"></div>
    </header>

    <main class="app-page">
      <section class="panel library-panel">
        <div class="panel-header">
          <div>
            <span class="section-kicker">Library</span>
            <h2>Your boards &amp; lessons</h2>
          </div>
          <div class="boards-controls">
            <a class="btn primary" href="/boards?new=1">+ New whiteboard</a>
            <a class="btn soft" href="/app">+ New lesson</a>
          </div>
        </div>
        <p class="boards-hint">Everything you've made — whiteboards and lessons — newest first. Filter by type, subject, grade or topic.</p>

        <div class="library-filters">
          <div class="seg-toggle" id="scopeToggle" role="tablist" aria-label="Which items">
            <button class="seg-btn active" data-scope="mine" role="tab">Yours</button>
            <button class="seg-btn" data-scope="shared" role="tab">Shared with you</button>
            <button class="seg-btn" data-scope="bookmarked" role="tab">Bookmarked</button>
          </div>
          <input type="search" id="filterSearch" placeholder="Search topic or title…" />
          <select id="filterType">
            <option value="">All types</option>
            <option value="whiteboard">Whiteboards</option>
            <option value="lesson">Lessons</option>
          </select>
          <select id="filterSubject">
            <option value="">All subjects</option>
            <option value="math">Math</option>
            <option value="science">Science</option>
          </select>
          <select id="filterGrade">
            <option value="">All grades</option>
            <option value="4">Grade 4</option><option value="5">Grade 5</option>
            <option value="6">Grade 6</option><option value="7">Grade 7</option>
            <option value="8">Grade 8</option><option value="9">Grade 9</option>
            <option value="10">Grade 10</option><option value="11">Grade 11</option>
            <option value="12">Grade 12</option>
          </select>
        </div>

        <div class="set-list lib-list" id="libraryList"></div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/common.js?v=boardsy4"></script>
  <script src="/library.js?v=boardsy4"></script>
</body>
</html>
